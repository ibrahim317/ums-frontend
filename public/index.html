<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة درجات الطالب</title>
    <meta name="description" content="عرض درجات أعمال السنة والـ GPA الخاصة بالطالب">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/grades.css">
</head>

<body>
    <main class="app-container">

        <!-- TOP NAVBAR -->
        <header class="top-navbar hidden" id="top-navbar">
            <div class="nav-left">
                <div class="nav-logo">
                    UMS Dashboard
                </div>
            </div>
        </header>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="view">
            <div class="login-card">
                <div class="login-header">
                    <h2>تسجيل الدخول</h2>
                    <p>أدخل بيانات نظام UMS الخاص بك</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">اسم المستخدم (الرقم القومي / الإيميل)</label>
                        <input type="text" id="username" name="username" required placeholder="أدخل اسم المستخدم">
                    </div>
                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
                    </div>
                    <div id="login-error" class="login-error hidden"></div>
                    <button type="submit" id="login-btn" class="primary-btn">
                        <span class="btn-text">دخول</span>
                        <div class="btn-loader hidden"></div>
                    </button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="view hidden">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <button class="sidebar-link active" data-target="year-work-tab" data-title="درجات أعمال السنة">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        أعمال السنة
                    </button>
                    <button class="sidebar-link" data-target="predictor-tab" data-title="توقعات الدرجات">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        التوقعات
                    </button>
                    <button class="sidebar-link" data-target="gpa-tab" data-title="السجل الأكاديمي (GPA)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                        </svg>
                        السجل الأكاديمي
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <button id="logout-btn" class="logout-ghost-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        تسجيل الخروج
                    </button>
                </div>
            </aside>

            <!-- MAIN CONTENT -->
            <div class="main-content">
                <div class="breadcrumb">الصفحة الرئيسية</div>

                <div class="content-header">
                    <h1 id="page-title">درجات أعمال السنة</h1>
                </div>

                <div class="dashboard-panel">
                    <div id="loader" class="loader-container">
                        <div class="spinner"></div>
                        <p>جاري جلب البيانات من النظام...</p>
                    </div>

                    <div id="error-container" class="error-container hidden">
                        <p id="error-message">حدث خطأ أثناء جلب البيانات.</p>
                        <button id="retry-btn" class="secondary-btn">إعادة المحاولة</button>
                    </div>

                    <!-- TAB CONTENT: YEAR WORK -->
                    <div id="year-work-tab" class="tab-content active hidden">
                        <div id="year-work-cache-container"></div>

                        <div class="filter-controls">
                            <div class="year-select-group">
                                <label for="year-select">العام الأكاديمي</label>
                                <div class="select-wrapper">
                                    <svg class="calendar-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                    <select id="year-select" disabled>
                                        <option value="">جاري التحميل...</option>
                                    </select>
                                    <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <div id="grades-container" class="grades-container"></div>
                    </div>

                    <!-- TAB CONTENT: PREDICTOR -->
                    <div id="predictor-tab" class="tab-content hidden">
                        <div id="predictor-cache-container"></div>
                        <div id="predictor-container" class="grades-container"></div>
                    </div>

                    <!-- TAB CONTENT: GPA -->
                    <div id="gpa-tab" class="tab-content hidden">
                        <div id="gpa-cache-container"></div>
                        <div id="gpa-container" class="grades-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
